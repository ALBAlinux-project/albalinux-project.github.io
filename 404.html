<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 ・ Norrsken Linux</title>
<style>
  /* Myou+2: Material 2 と 3 の中間デザイン */
  :root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #5f6368;
    --accent: #0b57d0;
    --accent-bg: #d3e3fd;
    --accent-text: #041e49;
    --accent-hover: #c2d7fb;
    --aurora-1: rgba(11,87,208,0.22);
    --aurora-2: rgba(143,209,158,0.28);
    --aurora-3: rgba(242,166,166,0.30);
    --shadow-1: 0 1px 2px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417;
      --card: #1d2125;
      --text: #e6e8eb;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --accent-bg: #2a3f5f;
      --accent-text: #d3e3fd;
      --accent-hover: #34507a;
      --aurora-1: rgba(138,180,248,0.18);
      --aurora-2: rgba(143,209,158,0.16);
      --aurora-3: rgba(242,166,166,0.14);
      --shadow-1: 0 1px 2px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417;
    --card: #1d2125;
    --text: #e6e8eb;
    --muted: #9aa0a6;
    --accent: #8ab4f8;
    --accent-bg: #2a3f5f;
    --accent-text: #d3e3fd;
    --accent-hover: #34507a;
    --aurora-1: rgba(138,180,248,0.18);
    --aurora-2: rgba(143,209,158,0.16);
    --aurora-3: rgba(242,166,166,0.14);
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Noto Sans JP", sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 32px;
    background: var(--card);
    box-shadow: var(--shadow-1);
  }
  .brand { font-size: 18px; font-weight: 600; }
  .brand span { color: var(--accent); }

  .hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
    background:
      radial-gradient(60% 80% at 20% 0%, var(--aurora-1), transparent 70%),
      radial-gradient(50% 70% at 80% 10%, var(--aurora-2), transparent 70%),
      radial-gradient(40% 60% at 55% 100%, var(--aurora-3), transparent 70%),
      var(--bg);
  }
  .box { max-width: 560px; }

  .code {
    font-size: clamp(72px, 14vw, 128px);
    font-weight: 600;
    line-height: 1;
    margin: 0 0 16px;
    background: linear-gradient(90deg, #0b57d0, #3d9a6a, #e07b7b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 12px; }
  .joke {
    display: inline-block;
    background: var(--card);
    border-radius: 16px;
    padding: 14px 20px;
    box-shadow: var(--shadow-1);
    color: var(--text);
    font-size: 14px;
    margin: 12px 0 28px;
  }

  .btn {
    display: inline-block;
    background: var(--accent-bg);
    color: var(--accent-text);
    text-decoration: none;
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 500;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent-hover); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 24px;
  }

  @media (max-width: 520px) {
    header { padding: 14px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Aurore <span>・ Norrsken Linux</span></div>
</header>

<section class="hero">
  <div class="box">
    <p class="code">404</p>
    <h1>そのページは、極夜の向こうへ消えました...。</h1>
    <p>探してみましたが、少なくとも彼、あるいは彼女はオーロラの下には見当たりませんでした。</p>
    <div class="joke">
      ヒント: URL のスペルか、リンクが古くなっていないか確かめてみてください。<br>
      それでも見つからなければ、そこはまだ誰も作っていない場所です。
    </div>
    <div>
      <a class="btn" href="/">トップへ戻る</a>
    </div>
  </div>
</section>

<footer>
  <div>Norrsken Linux ・ GPL-3.0-or-later ・ Designed in Myou+2</div>
  <div>Made by 猫田</div>
</footer>

</body>
</html>
